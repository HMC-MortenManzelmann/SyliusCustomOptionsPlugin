name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6"
    workflow_dispatch: ~

jobs:
    tests:
        runs-on: ubuntu-24.04

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, MySQL ${{ matrix.mysql }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3"]
                symfony: ["^7.4"]
                sylius: ["~2.3.0"]
                node: ["22.x"]
                mysql: ["8.0"]

        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root:root@127.0.0.1:3306/sylius_test?serverVersion=${{ matrix.mysql }}"
            BEHAT_BASE_URL: "http://127.0.0.1:8081/"
            CHROME_API_URL: "http://127.0.0.1:9222"

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl, gd, exif, pdo_mysql, sodium
                    tools: symfony
                    coverage: none
                    ini-values: memory_limit=-1

            -
                name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: "${{ matrix.node }}"

            -
                name: Shutdown default MySQL
                run: sudo service mysql stop

            -
                name: Setup MySQL
                uses: mirromutth/mysql-action@v1.1
                with:
                    mysql version: "${{ matrix.mysql }}"
                    mysql root password: "root"

            -
                name: Restrict Symfony version
                if: matrix.symfony != ''
                run: composer config extra.symfony.require "${{ matrix.symfony }}"

            -
                name: Restrict Sylius version
                if: matrix.sylius != ''
                run: composer require "sylius/sylius:${{ matrix.sylius }}" --no-update --no-scripts --no-interaction

            -
                name: Install PHP dependencies
                run: composer update --no-interaction --prefer-dist

            -
                name: Prepare test application database
                run: |
                    vendor/bin/console doctrine:database:create -vvv
                    vendor/bin/console doctrine:schema:create -vvv

            -
                name: Prepare test application assets
                run: |
                    corepack enable
                    corepack prepare yarn@1.22.22 --activate
                    vendor/bin/console assets:install -vvv
                    (cd vendor/sylius/test-application && yarn install && yarn build)

            -
                name: Prepare test application cache
                run: vendor/bin/console cache:warmup -vvv

            -
                name: Load fixtures in test application
                run: vendor/bin/console sylius:fixtures:load -n

            -
                name: Validate composer.json
                run: composer validate --ansi --strict --no-check-publish

            -
                name: Validate database schema
                run: vendor/bin/console doctrine:schema:validate

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse -c phpstan.neon -l max src/

            -
                name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always

            -
                name: Run Chrome headless
                run: |
                    google-chrome \
                        --headless \
                        --disable-gpu \
                        --no-sandbox \
                        --disable-dev-shm-usage \
                        --remote-debugging-port=9222 \
                        --window-size=2880,1800 \
                        > /tmp/chrome.log 2>&1 &
                    for _ in $(seq 1 30); do
                        curl -sf http://127.0.0.1:9222/json/version && exit 0
                        sleep 1
                    done
                    echo "Chrome did not open the debugging port" >&2
                    cat /tmp/chrome.log >&2
                    exit 1

            -
                name: Run webserver
                run: symfony server:start --port=8081 --no-tls --daemon

            -
                name: Run Behat
                run: vendor/bin/behat --colors --strict -vvv --no-interaction --tags '~@shop' || vendor/bin/behat --colors --strict -vvv --no-interaction --rerun --tags '~@shop'

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: Behat logs
                    path: etc/build/
                    if-no-files-found: ignore
