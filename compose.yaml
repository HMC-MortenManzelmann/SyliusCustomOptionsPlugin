x-php-environment: &php-environment
    APP_ENV: test
    DATABASE_URL: mysql://root:root@mysql:3306/sylius_%kernel.environment%?serverVersion=8.0
    BEHAT_BASE_URL: http://nginx:8081/
    CHROME_API_URL: http://chrome:9222
    XDEBUG_CONFIG: ${XDEBUG_CONFIG:-}
    XDEBUG_SESSION: ${XDEBUG_SESSION:-}
    PHP_IDE_CONFIG: serverName=sylius-custom-options
    HOME: /tmp
    COMPOSER_HOME: /tmp/composer
    SYLIUS_TEST_APP_BUNDLES_PATH: tests/TestApplication/config/bundles.php
    SYLIUS_TEST_APP_CONFIGS_TO_IMPORT: ../../../../tests/TestApplication/config/config.yaml
    SYLIUS_TEST_APP_ROUTES_TO_IMPORT: ../../../../tests/TestApplication/config/routes.yaml

x-php-volumes: &php-volumes
    - .:/plugin
    - ./docker/php/conf.d/zz-app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    - ./docker/php/conf.d/zz-xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    - ./docker/php/xdebug-override.ini:/usr/local/etc/php/conf.d/zzz-xdebug-override.ini:ro

services:
    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 10s

    php:
        build:
            context: .
            args:
                UID: ${HOST_UID:-1000}
                GID: ${HOST_GID:-1000}
        image: sylius-custom-options-plugin:php
        working_dir: /plugin
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        env_file:
            - path: docker/xdebug.env
              required: false
        volumes: *php-volumes
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment: *php-environment
        depends_on:
            mysql:
                condition: service_healthy
            chrome:
                condition: service_healthy
                required: false

    php-fpm:
        build:
            context: .
            args:
                UID: ${HOST_UID:-1000}
                GID: ${HOST_GID:-1000}
        image: sylius-custom-options-plugin:php
        working_dir: /plugin
        command: ["php-fpm", "-F"]
        env_file:
            - path: docker/xdebug.env
              required: false
        volumes: *php-volumes
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment: *php-environment
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        ports:
            - "127.0.0.1:${WEB_DEV_PORT:-8080}:8080"
            - "127.0.0.1:${WEB_TEST_PORT:-8081}:8081"
        volumes:
            - .:/plugin:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php-fpm

    chrome:
        profiles: [js]
        image: zenika/alpine-chrome
        command:
            - chromium-browser
            - --headless
            - --disable-gpu
            - --no-sandbox
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --remote-allow-origins=*
        shm_size: 2gb
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9222/json/version || exit 1"]
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 10s

volumes:
    mysql-data:
