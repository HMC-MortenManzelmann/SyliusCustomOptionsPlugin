sylius_grid:
    templates:
        action:
            import_prices: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option/grid/action/import_prices.html.twig'
            delete_unused_customer_option: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option/grid/action/delete.html.twig'
    grids:
        brille24_admin_customer_option_grid:
            driver:
                name: doctrine/orm
                options:
                    class: '%brille24.model.customer_option.class%'
            fields:
                code:
                    type: string
                    label: sylius.ui.code
                name:
                    type: string
                    label: sylius.ui.name
                typeCode:
                    type: twig
                    label: sylius.ui.type
                    options:
                        template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option/grid/field/type.html.twig'
                required:
                    type: twig
                    label: brille24.ui.required
                    options:
                        template: '@SyliusAdmin/shared/grid/field/boolean.html.twig'
            filters:
                code:
                    type: string
                    label: sylius.ui.code
            actions:
                main:
                    create:
                        type: create

                    import_prices:
                        type: 'import_prices'
                        label: 'brille24.form.customer_options.import_prices'
                        icon: 'tabler:upload'
                        options:
                            link:
                                route: 'brille24_customer_option_price_import'
                item:
                    update:
                        type: update
                    delete:
                        type: delete_unused_customer_option
