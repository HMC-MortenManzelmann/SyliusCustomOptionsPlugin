sylius_twig_hooks:
    hooks:
        'brille24.admin.customer_option_group.create.content':
            form:
                component: 'brille24:admin:customer_option_group:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: false
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections':
            general:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/shared/form/sections/general.html.twig'
                priority: 300
            translations:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/shared/form/sections/translations.html.twig'
                priority: 200
            options:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/options.html.twig'
                priority: 100
            validators:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.general':
            default:
                enabled: false
            code:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/shared/form/sections/general/code.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.translations':
            name:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/shared/form/sections/translations/name.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.options':
            option:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/options/option.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.options.option':
            option:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/options/option/option.html.twig'
                priority: 200
            position:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/options/option/position.html.twig'
                priority: 100
            button_delete:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/shared/form/button_delete.html.twig'
                configuration:
                    class: 'col-12 col-md-3 mb-3 text-end'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.validators':
            validator:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators/validator.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.validators.validator':
            conditions:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators/validator/conditions.html.twig'
                configuration:
                    collection: conditions
                    title: brille24.ui.conditions
                priority: 300
            constraints:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators/validator/conditions.html.twig'
                configuration:
                    collection: constraints
                    title: brille24.ui.constraints
                priority: 200
            error_message:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators/validator/error_message.html.twig'
                priority: 100
            button_delete:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/shared/form/button_delete.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.validators.validator.conditions':
            condition:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators/validator/condition.html.twig'
                priority: 0

        'brille24.admin.customer_option_group.create.content.form.sections.validators.validator.constraints':
            condition:
                template: '@Brille24SyliusCustomerOptionsPlugin/admin/customer_option_group/form/sections/validators/validator/condition.html.twig'
                priority: 0
